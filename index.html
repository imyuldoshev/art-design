<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./style.css" />
    <title>Art.Design</title>
  </head>
  <body>
    <!-- header start -->
    <header>
      <!-- navbar start -->
      <nav class="navbar">
        <div class="container">
          <div class="navigation">
            <div class="logo">
              <a href="#">Art.Design</a>
            </div>
            <div class="navbar_nav">
              <a href="#">home</a>
              <a href="#">about</a>
              <a href="#">blog</a>
              <a href="#">about</a>
            </div>
          </div>
        </div>
      </nav>
      <!-- navbar end -->
      <div class="banner">
        <div class="container">
          <h1 class="banner_title"><span>Art. </span>Design Blog</h1>
          <p>Everything That You Want To Know About Art & Design</p>
          <form>
            <input
              type="text"
              placeholder="find your food..."
              class="search_input"
            />
            <button class="search_btn">
              <i class="fas fa-search"></i>
            </button>
          </form>
        </div>
      </div>
    </header>
    <!-- header end -->
    <main>
      <section class="design" id="design">
        <div class="container">
          <div class="title">
            <h2>Recent Arts & Designs</h2>
            <p>recent arts & designs on the blog</p>
          </div>
          <div class="design_content">
            <div class="design_item">
              <div class="design_img">
                <img src="./pictures/art-design-1.jpg" alt="" />
                <span><i class="far fa-heart"></i>22</span>
                <span>Art & Design</span>
              </div>
            </div>
            <div class="design_title">
              <a href="#">
                make an awesome art portfolio for college or university
              </a>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
